[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "second-opinion"
version = "0.1.0"
description = "Research claim auditing engine and API"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas>=2.0,<4",
    "jsonschema>=4.0,<5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
second-opinion = "second_opinion.cli:main"

[tool.setuptools.packages.find]
include = ["second_opinion*", "apps.api*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the real TCGA release in SO_RELEASE_DIR"]

[tool.setuptools.package-data]
second_opinion = ["roles.yaml"]
